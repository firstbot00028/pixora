<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixora - Join the Empire</title>
    <style>
        /* 🔱 THE SOVEREIGN INTERNAL CSS */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000000; /* Pure Black */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }

        .signup-container {
            width: 320px;
            text-align: center;
            background: #121212; /* Dark Grey Box */
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 42, 109, 0.15);
            border: 1px solid #333;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 35px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff2a6d, #ff0000);
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* 🦾 Input Fields */
        input {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #ff2a6d;
            background: #222;
        }

        /* 🦾 Signup Button */
        button {
            background: linear-gradient(45deg, #ff2a6d, #ff0000);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.4);
        }

        .login-link {
            margin-top: 25px;
            font-size: 14px;
            color: #888;
        }

        .login-link a {
            color: #ff2a6d;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="signup-container">
    <h1>Pixora</h1>
    <p class="subtitle">Join the Digital Empire 🦾</p>

    <input type="text" id="new-username" placeholder="Username" autocomplete="off">
    <input type="text" id="phone" placeholder="Phone number">
    <input type="password" id="new-password" placeholder="Password">

    <button type="button" onclick="signup()">Sign up 💎</button>

    <p class="login-link">
        Already have an account? <a href="index.html">Login</a>
    </p>
</div>

<script src="app.js"></script>

</body>
</html>
