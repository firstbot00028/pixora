<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixora - Create Post</title>
    <style>
        /* 🔱 INTERNAL PREMIUM CSS */
        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            background: #000000; /* Pure Black Background */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .create-container {
            width: 90%;
            max-width: 400px;
            background: #121212; /* Dark Grey Container */
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(255, 42, 109, 0.1);
            border: 1px solid #333;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #ff2a6d; /* Sovereign Pink-Red */
            font-size: 24px;
        }

        /* 🦾 File Input Styling */
        input[type="file"] {
            margin-bottom: 15px;
            color: #bbb;
            font-size: 14px;
            width: 100%;
        }

        /* 🦾 Caption Box */
        textarea {
            width: 100%;
            height: 120px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 10px;
            color: white;
            padding: 12px;
            font-size: 15px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        textarea:focus {
            outline: none;
            border-color: #ff2a6d;
        }

        /* 🦾 Upload Button */
        button {
            background: linear-gradient(45deg, #ff2a6d, #ff0000);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
        }

        .back-link {
            margin-top: 15px;
            display: block;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="create-container">
        <h2>New Post 🔱</h2>

        <input type="file" id="postImage" accept="image/*">

        <textarea id="caption" placeholder="Write a catchy caption muthe..."></textarea>

        <button onclick="createPost()">Upload to Empire 🚀</button>

        <a href="home.html" class="back-link">Cancel</a>
    </div>

    <script src="app.js"></script>

</body>
</html>
