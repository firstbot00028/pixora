<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixora - Login</title>
    <style>
        /* 🔱 THE SOVEREIGN INTERNAL CSS */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000000; /* Pure Black Background */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }

        .login-container {
            width: 320px;
            text-align: center;
            background: #121212; /* Dark Grey Container */
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 42, 109, 0.15);
            border: 1px solid #333;
        }

        .icon {
            font-size: 32px;
            background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 22px; /* Squircle look */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 5px 15px rgba(253, 29, 29, 0.4);
        }

        .logo h1 {
            margin: 0;
            font-size: 35px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(45deg, #ff2a6d, #ff0000);
            -webkit-background-clip: text;
            color: transparent;
        }

        .logo p {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* 🦾 Input Styling */
        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #ff2a6d;
            background: #222;
        }

        /* 🦾 Button Styling */
        button {
            background: linear-gradient(45deg, #ff2a6d, #ff0000);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.4);
        }

        .signup {
            margin-top: 25px;
            font-size: 14px;
            color: #888;
        }

        .signup a {
            color: #ff2a6d;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-container">
    <div class="logo">
        <div class="icon">P ✦</div>
        <h1>Pixora</h1>
        <p>Share your world</p>
    </div>

    <input id="username" placeholder="Username" autocomplete="off">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login 💎</button>

    <p class="signup">
        New user? <a href="signup.html">Sign up</a>
    </p>
</div>

<script src="app.js"></script>

</body>
</html>
