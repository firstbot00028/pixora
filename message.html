<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixora - Messages</title>
    <style>
        /* 🔱 INTERNAL PREMIUM CSS */
        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            background: #000000;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 🔱 Header */
        .chat-header {
            padding: 15px;
            background: #121212;
            border-bottom: 1px solid #333;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 20px;
            color: #ff2a6d;
            letter-spacing: 1px;
        }

        /* 🔱 Chat Area */
        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 🦾 Message Bubbles */
        .msg-bubble {
            background: #1a1a1a;
            color: #00ff00; /* Hacker Green / Matrix style */
            padding: 10px 15px;
            border-radius: 15px 15px 15px 0px;
            max-width: 80%;
            align-self: flex-start;
            font-size: 15px;
            border: 0.5px solid #333;
            box-shadow: 0 2px 10px rgba(0, 255, 0, 0.05);
            word-wrap: break-word;
        }

        /* 🔱 Input Area */
        .input-area {
            padding: 15px;
            background: #121212;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
            position: sticky;
            bottom: 0;
        }

        input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 25px;
            color: white;
            padding: 12px 20px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff2a6d;
        }

        button {
            background: #ff2a6d;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: #ff0000;
        }
        
        .back-nav {
            padding: 10px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="chat-header">
        <a href="home.html" class="back-nav">← Back</a>
        <h2>Pixora Messages 🔱</h2>
    </div>

    <div id="chat">
        <div class="msg-bubble">Welcome to Sovereign Chat, Adam! 🦾⚡️</div>
    </div>

    <div class="input-area">
        <input id="msg" placeholder="Type a secret message..." onkeydown="if(event.key==='Enter') send()">
        <button onclick="send()">Send 🚀</button>
    </div>

    <script>
        function send() {
            let input = document.getElementById("msg");
            let text = input.value;
            if (text.trim() === "") return;

            let chat = document.getElementById("chat");
            let div = document.createElement("div");
            div.className = "msg-bubble";
            div.innerText = text;
            
            chat.appendChild(div);
            input.value = ""; // Clear input
            
            // Auto scroll to bottom
            chat.scrollTop = chat.scrollHeight;
        }
    </script>

</body>
</html>
