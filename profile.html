<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixora - Sovereign Profile</title>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background: #000; color: white; overflow-x: hidden; }
        
        /* Profile Layout */
        .profile-header { display: flex; align-items: center; padding: 30px 20px; max-width: 450px; margin: auto; }
        .profile-pic { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #ff2a6d; padding: 3px; }
        .stats { display: flex; flex: 1; justify-content: space-around; text-align: center; margin-left: 20px; }
        .stats h3 { margin: 0; font-size: 18px; }
        .stats p { margin: 0; font-size: 12px; color: #888; }

        .user-info { max-width: 450px; margin: auto; padding: 0 25px; }
        #profileName { font-size: 20px; display: flex; align-items: center; gap: 5px; }

        /* Scalloped Red Tick */
        .redtick {
            width: 16px; height: 16px; background: red; display: inline-flex; align-items: center; justify-content: center;
            clip-path: polygon(100% 50%, 94.46% 65.14%, 94.46% 81.86%, 79.31% 87.39%, 69.13% 100%, 50% 98.41%, 30.87% 100%, 20.69% 87.39%, 5.54% 81.86%, 5.54% 65.14%, 0% 50%, 5.54% 34.86%, 5.54% 18.14%, 20.69% 12.61%, 30.87% 0%, 50% 1.59%, 69.13% 0%, 79.31% 12.61%, 94.46% 18.14%, 94.46% 34.86%);
            font-size: 9px; color: white;
        }
        .redtick::after { content: "✔"; }

        /* Action Buttons */
        .btn-container { max-width: 450px; margin: 20px auto; display: flex; gap: 10px; padding: 0 20px; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-sec { background: #ff2a6d; color: white; }

        /* 🔒 REALISTIC SCANNER (No Hacker Green) */
        #scannerOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000;
        }
        .scan-frame { width: 220px; height: 220px; border: 1px solid #333; border-radius: 30px; position: relative; overflow: hidden; background: #050505; }
        .scan-line { width: 100%; height: 2px; background: #ff2a6d; position: absolute; box-shadow: 0 0 15px #ff2a6d; animation: moveLine 2.5s infinite linear; }
        @keyframes moveLine { 0% { top: 0; } 100% { top: 100%; } }
        .scan-status { margin-top: 30px; color: #ff2a6d; font-family: monospace; font-size: 13px; }

        /* ✅ SUCCESS PAGE (Full Screen) */
        #successScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 6000; text-align: center;
        }
        .success-icon { font-size: 60px; margin-bottom: 20px; }
        .success-btn { margin-top: 40px; padding: 12px 60px; border-radius: 25px; border: none; background: white; font-weight: bold; }
    </style>
</head>
<body>

    <div class="profile-header">
        <img class="profile-pic" src="https://via.placeholder.com/120">
        <div class="stats">
            <div><h3>12</h3><p>Posts</p></div>
            <div><h3>100M</h3><p>Followers</p></div>
            <div><h3>1</h3><p>Following</p></div>
        </div>
    </div>

    <div class="user-info">
        <h2 id="profileName">@AiraAdam <span class="redtick"></span></h2>
        <p style="color: #bbb; font-size: 14px;">Privacy Architect | Pixora Founder 🦾</p>
    </div>

    <div class="btn-container">
        <button class="btn" style="background: #1a1a1a; color:white;">Edit Profile</button>
        <button class="btn btn-sec" onclick="startScan()">Get E2EE</button>
    </div>

    <div id="scannerOverlay">
        <div class="scan-frame"><div class="scan-line"></div></div>
        <p class="scan-status" id="statusMsg">VERIFYING IDENTITY...</p>
    </div>

    <div id="successScreen">
        <div id="bigIcon" class="success-icon">⏳</div>
        <h2 id="msgT">Wait for 24 Hours</h2>
        <p id="msgD" style="color:#888; padding: 0 40px;">Processing your E2EE key via Python Secure Logic.</p>
        <button id="finalBtn" class="success-btn" style="display:none;" onclick="applyLock()">Done</button>
    </div>

    <script>
        function startScan() {
            document.getElementById('scannerOverlay').style.display = 'flex';
            const msg = document.getElementById('statusMsg');

            setTimeout(() => { msg.innerText = "GENERATING SHA-256 HASH..."; }, 1500);
            
            setTimeout(() => {
                document.getElementById('scannerOverlay').style.display = 'none';
                document.getElementById('successScreen').style.display = 'flex';

                // 6 seconds kazhinju Confirm aakunnnu
                setTimeout(() => {
                    document.getElementById('bigIcon').innerText = "🛡️";
                    document.getElementById('msgT').innerText = "ID Confirmed!";
                    document.getElementById('msgD').innerText = "Your account is now protected with Pixora E2EE. Your ID is your Private Key.";
                    document.getElementById('finalBtn').style.display = 'block';
                }, 6000);
            }, 4000);
        }

        function applyLock() {
            localStorage.setItem("locked", "true");
            location.reload(); // Reload to apply changes
        }

        window.onload = function() {
            if(localStorage.getItem("locked") === "true") {
                document.getElementById('profileName').innerHTML = "🔒 @AiraAdam <span class='redtick'></span>";
            }
        }
    </script>
</body>
</html>
