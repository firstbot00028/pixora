<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixora - E2EE Secure Profile</title>
    <style>
        /* 🔱 THE SOVEREIGN DARK THEME */
        body { margin: 0; font-family: -apple-system, sans-serif; background: #000000; color: white; padding-bottom: 80px; overflow-x: hidden; }
        
        .profile-header { display: flex; align-items: center; padding: 30px 20px 10px 20px; max-width: 450px; margin: auto; }
        .profile-pic-container { flex: 0 0 90px; margin-right: 30px; position: relative; }
        .profile-pic-container img {
            width: 90px; height: 90px; border-radius: 50%;
            object-fit: cover; border: 3.5px solid #ff2a6d; padding: 3px; background: white;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.3);
        }

        .stats { display: flex; flex: 1; justify-content: space-between; text-align: center; }
        .stats h3 { margin: 0; font-size: 18px; font-weight: bold; color: #fff; }
        .stats p { margin: 0; font-size: 12px; color: #888; }

        .user-info { max-width: 450px; margin: auto; padding: 10px 25px; }
        #profileName { margin: 0; font-size: 20px; font-weight: bold; display: flex; align-items: center; transition: 0.5s; }
        
        .bio-box { margin-top: 8px; font-size: 14px; color: #efefef; line-height: 1.4; }
        .bio-box span { color: #ff2a6d; font-weight: 600; }

        /* 🔱 REAL SCALLOPED RED TICK */
        .redtick {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; background-color: red; color: white; 
            font-size: 9px; margin-left: 6px; position: relative;
            clip-path: polygon(100% 50%, 94.46% 65.14%, 94.46% 81.86%, 79.31% 87.39%, 69.13% 100%, 50% 98.41%, 30.87% 100%, 20.69% 87.39%, 5.54% 81.86%, 5.54% 65.14%, 0% 50%, 5.54% 34.86%, 5.54% 18.14%, 20.69% 12.61%, 30.87% 0%, 50% 1.59%, 69.13% 0%, 79.31% 12.61%, 94.46% 18.14%, 94.46% 34.86%);
        }
        .redtick::after { content: "✔"; }

        /* 🦾 ACTION BUTTONS */
        .action-buttons { max-width: 450px; margin: 15px auto; display: flex; gap: 10px; padding: 0 20px; }
        .btn { flex: 1; background: #1a1a1a; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-secure { background: #ff2a6d; box-shadow: 0 0 10px rgba(255, 42, 109, 0.4); }

        /* 🦾 SCANNER OVERLAY */
        #simOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 2000;
        }
        .scan-box { width: 200px; height: 200px; border: 2px solid #333; position: relative; border-radius: 20px; overflow: hidden; }
        .scanner-line { width: 100%; height: 3px; background: #ff2a6d; position: absolute; box-shadow: 0 0 20px #ff2a6d; animation: scanAnim 2s infinite; }
        @keyframes scanAnim { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
        .status-txt { margin-top: 20px; color: #ff2a6d; font-family: monospace; letter-spacing: 1px; }

        /* 🦾 SUCCESS/WAIT PAGE */
        #successPage {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 3000; text-align: center; padding: 30px;
        }
        .big-icon { font-size: 60px; margin-bottom: 20px; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .title { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        .desc { color: #888; font-size: 14px; line-height: 1.6; max-width: 300px; }
        .done-btn { margin-top: 40px; background: white; color: black; border: none; padding: 15px 50px; border-radius: 30px; font-weight: bold; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-around; padding: 15px 0; z-index: 1000; }
        .bottom-nav a { text-decoration: none; font-size: 24px; filter: invert(1); }
    </style>
</head>
<body>

    <div class="profile-header">
        <div class="profile-pic-container">
            <img id="profilePic" src="https://via.placeholder.com/120">
        </div>
        <div class="stats">
            <div><h3>12</h3><p>Posts</p></div>
            <div><h3>100M</h3><p>Followers</p></div>
            <div><h3>1</h3><p>Following</p></div>
        </div>
    </div>

    <div class="user-info">
        <h2 id="profileName">@AiraAdam <span id="profileTick" class="redtick"></span></h2>
        <div class="bio-box">
            <span>Sovereign Founder of Pixora</span><br>
            Exploring the Digital Empire 🦾⚡️<br>
            Verified E2EE Protection Active 🏴
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn">Edit Profile</button>
        <button class="btn btn-secure" onclick="startVerification()">Get E2EE</button>
    </div>

    <div id="simOverlay">
        <div class="scan-box"><div class="scanner-line"></div></div>
        <p class="status-txt" id="scanStatus">INITIALIZING IDENTITY SCAN...</p>
    </div>

    <div id="successPage">
        <div id="iconBox" class="big-icon">⏳</div>
        <div id="msgTitle" class="title">Wait for 24 Hours</div>
        <div id="msgDesc" class="desc">Our Python engine is generating your unique encryption keys based on your ID card.</div>
        <button id="doneBtn" class="done-btn" style="display:none;" onclick="applyLock()">Done</button>
    </div>

    <div class="bottom-nav">
        <a href="#">🏠</a><a href="#">🎬</a><a href="#">➕</a><a href="#">💬</a><a href="#" style="border-bottom: 2px solid white;">👤</a>
    </div>

    <script>
        function startVerification() {
            const overlay = document.getElementById('simOverlay');
            const scanStatus = document.getElementById('scanStatus');
            const successPage = document.getElementById('successPage');
            const iconBox = document.getElementById('iconBox');
            const msgTitle = document.getElementById('msgTitle');
            const msgDesc = document.getElementById('msgDesc');
            const doneBtn = document.getElementById('doneBtn');

            overlay.style.display = 'flex';

            // Step 1: Scanner Logic
            setTimeout(() => { scanStatus.innerText = "EXTRACTING SHA-256 HASH..."; }, 1500);
            setTimeout(() => { scanStatus.innerText = "SYNCING WITH PIXORA BACKEND..."; }, 3000);

            // Step 2: Move to Wait Screen
            setTimeout(() => {
                overlay.style.display = 'none';
                successPage.style.display = 'flex';

                // Step 3: Wait 6 seconds and Confirm
                setTimeout(() => {
                    iconBox.innerText = "🛡️";
                    iconBox.classList.add('big-red-tick'); // Optional styling
                    msgTitle.innerText = "ID Confirmed!";
                    msgDesc.innerText = "Your account is now cryptographically secured. Your identity is your master key.";
                    doneBtn.style.display = "block";
                }, 6000);

            }, 4500);
        }

        function applyLock() {
            const nameArea = document.getElementById('profileName');
            const successPage = document.getElementById('successPage');
            
            successPage.style.display = 'none';
            // Username-nu neere lock icon varunnu
            nameArea.innerHTML = `🔒 @AiraAdam <span class="redtick"></span>`;
            
            // Save state so it stays after refresh
            localStorage.setItem("pixora_locked", "true");
        }

        // On Page Load: Check if already locked
        window.onload = function() {
            if(localStorage.getItem("pixora_locked") === "true") {
                document.getElementById('profileName').innerHTML = `🔒 @AiraAdam <span class="redtick"></span>`;
            }
        }
    </script>
</body>
</html>
