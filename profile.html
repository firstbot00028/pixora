<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixora - Secure Profile</title>
    <style>
        /* 🔱 EXISTING CSS */
        body { margin: 0; font-family: -apple-system, sans-serif; background: #000000; color: white; padding-bottom: 120px; overflow-x: hidden; }
        
        .profile-header { display: flex; align-items: center; padding: 30px 20px 10px 20px; max-width: 450px; margin: auto; }
        .profile-pic-container { flex: 0 0 90px; margin-right: 30px; position: relative; }
        .profile-pic-container img {
            width: 90px; height: 90px; border-radius: 50%;
            object-fit: cover; border: 3.5px solid #ff2a6d; padding: 3px; background: white;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.3);
        }

        .stats { display: flex; flex: 1; justify-content: space-between; text-align: center; }
        .stats h3 { margin: 0; font-size: 18px; font-weight: bold; color: #fff; }
        .stats p { margin: 0; font-size: 12px; color: #888; }

        .user-info { max-width: 450px; margin: auto; padding: 10px 25px; }
        #profileName { margin: 0; font-size: 20px; font-weight: bold; display: flex; align-items: center; }
        
        .bio-box { margin-top: 8px; font-size: 14px; color: #efefef; line-height: 1.4; }
        .bio-box span { color: #ff2a6d; font-weight: 600; }

        /* 🔱 RED TICK STYLE */
        .redtick {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; background-color: red; color: white; 
            font-size: 9px; margin-left: 6px; position: relative;
            clip-path: polygon(100% 50%, 94.46% 65.14%, 94.46% 81.86%, 79.31% 87.39%, 69.13% 100%, 50% 98.41%, 30.87% 100%, 20.69% 87.39%, 5.54% 81.86%, 5.54% 65.14%, 0% 50%, 5.54% 34.86%, 5.54% 18.14%, 20.69% 12.61%, 30.87% 0%, 50% 1.59%, 69.13% 0%, 79.31% 12.61%, 94.46% 18.14%, 94.46% 34.86%);
        }
        .redtick::after { content: "✔"; }

        /* 🦾 NEW: ACTION BUTTONS */
        .action-buttons { max-width: 450px; margin: 15px auto; display: flex; gap: 10px; padding: 0 20px; }
        .btn { flex: 1; background: #1a1a1a; color: white; border: none; padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-secure { background: #ff2a6d; }

        /* 🦾 NEW: SIMULATION OVERLAY */
        #simOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 2000; text-align: center;
        }
        .scanner-line { width: 250px; height: 2px; background: #ff2a6d; box-shadow: 0 0 15px #ff2a6d; position: relative; animation: scan 2s infinite; }
        @keyframes scan { 0% { top: 0; } 50% { top: 150px; } 100% { top: 0; } }
        
        .status-msg { margin-top: 20px; color: #ff2a6d; font-family: monospace; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-around; padding: 15px 0; z-index: 1000; }
        .bottom-nav a { text-decoration: none; font-size: 24px; filter: invert(1); }
    </style>
</head>
<body>

    <div class="profile-header">
        <div class="profile-pic-container">
            <img id="profilePic" src="https://via.placeholder.com/120">
        </div>
        <div class="stats">
            <div><h3 id="postCount">12</h3><p>Posts</p></div>
            <div><h3 id="profileFollowers">100M</h3><p>Followers</p></div>
            <div><h3>1</h3><p>Following</p></div>
        </div>
    </div>

    <div class="user-info">
        <h2 id="profileName">@AiraAdam <span id="profileTick" class="redtick"></span></h2>
        <div class="bio-box">
            <span>Sovereign Founder of Pixora</span><br>
            "Privacy isn't a feature, it's a right." 🦾⚡️<br>
            Python Logic | E2EE Protocol 🏴
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn">Edit Profile</button>
        <button class="btn btn-secure" onclick="startSimulation()">Get E2EE</button>
    </div>

    <div id="simOverlay">
        <h3 id="simTitle">Identity Verification</h3>
        <div style="width: 250px; height: 150px; border: 2px dashed #444; position: relative; overflow: hidden;">
            <div class="scanner-line"></div>
        </div>
        <p class="status-msg" id="statusText">Scanning for Verified Identity...</p>
    </div>

    <div class="bottom-nav">
        <a href="#">🏠</a><a href="#">🎬</a><a href="#">➕</a><a href="#">💬</a><a href="#" style="border-bottom: 2px solid white;">👤</a>
    </div>

    <script>
        function startSimulation() {
            const overlay = document.getElementById('simOverlay');
            const status = document.getElementById('statusText');
            overlay.style.display = 'flex';

            setTimeout(() => { status.innerText = "Extracting Python SHA-256 Logic..."; }, 2000);
            setTimeout(() => { status.innerText = "Generating Sovereign Keys..."; }, 4000);
            setTimeout(() => { 
                status.style.color = "#00ff00";
                status.innerText = "SUCCESS: E2EE Protocol Active! (Submitted to Pixora Backend)"; 
            }, 6000);
            setTimeout(() => { overlay.style.display = 'none'; alert("Successfully submitted! Your Identity is now your Key. Wait 24 hours for Red Tick activation."); }, 8500);
        }
    </script>
</body>
</html>
