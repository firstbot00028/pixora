<!DOCTYPE html>
<html>
<head>
    <title>Pixora - Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <style>
        .redtick { color: #ff0000; font-weight: bold; margin-left: 5px; display: none; }
    </style>
</head>

<body>

<div class="profile">
    <img id="profilePic" src="https://via.placeholder.com/120">
    <input type="file" onchange="uploadPic(event)">
    
    <h2 id="profileName">@Loading...</h2>
</div>

<div class="stats">
    <div><h3>0</h3><p>Posts</p></div>
    <div><h3 id="profileFollowers">0</h3><p>Followers</p></div>
    <div><h3>0</h3><p>Following</p></div>
</div>

<script src="app.js"></script>

<script>
    // 🔱 Sovereign Profile Fix Script
    document.addEventListener("DOMContentLoaded", function() {
        // App.js load aakan cheriya oru time delay kodukkunnu
        setTimeout(() => {
            let loggedUser = localStorage.getItem("currentUser");
            let nameDisplay = document.getElementById("profileName");
            let followers = document.getElementById("profileFollowers");

            if (loggedUser) {
                // User-inte peru set cheyyunnu
                nameDisplay.innerHTML = `@${loggedUser} <span id="profileTick" class="redtick">✔</span>`;
                
                // Founder check
                if (loggedUser === "AiraAdam") {
                    document.getElementById("profileTick").style.display = "inline";
                    followers.innerText = "100M";
                } else {
                    document.getElementById("profileTick").style.display = "none";
                    followers.innerText = "0";
                }
            } else {
                // User illa enkil mathram login page-ilekku
                console.log("No user found, staying for debug...");
                // window.location.href = "index.html"; // Ithu temporary aayi comment cheythu, error check cheyyan
            }
        }, 100); 
    });
</script>

</body>
</html>
