<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixora - Home</title>
    <style>
        /* 🔱 THE SOVEREIGN INTERNAL CSS */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000000; /* Pure Black Background */
            color: white;
            padding-bottom: 70px; /* Space for bottom nav */
        }

        /* 🔱 NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #000000;
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff2a6d, #ff0000);
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }

        .navbar a {
            text-decoration: none;
            font-size: 24px;
        }

        /* 🔱 FEED & POSTS */
        .feed {
            max-width: 500px;
            margin: auto;
            padding-top: 10px;
        }

        .post {
            background: #000000;
            margin-bottom: 25px;
            border-bottom: 0.5px solid #1a1a1a;
        }

        .post-header {
            padding: 12px;
            display: flex;
            align-items: center;
        }

        .post-header h4 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: #efefef;
            display: flex;
            align-items: center;
        }

        /* 🔱 SCALLOPED RED TICK (Legendary Look) */
        .redtick {
            display: inline-flex; align-items: center; justify-content: center;
            width: 14px; height: 14px; background-color: red; color: white; 
            font-size: 8px; margin-left: 5px; position: relative;
            clip-path: polygon(100% 50%, 94.46% 65.14%, 94.46% 81.86%, 79.31% 87.39%, 69.13% 100%, 50% 98.41%, 30.87% 100%, 20.69% 87.39%, 5.54% 81.86%, 5.54% 65.14%, 0% 50%, 5.54% 34.86%, 5.54% 18.14%, 20.69% 12.61%, 30.87% 0%, 50% 1.59%, 69.13% 0%, 79.31% 12.61%, 94.46% 18.14%, 94.46% 34.86%);
        }
        .redtick::after { content: "✔"; }

        .post img {
            width: 100%;
            display: block;
            background: #121212;
        }

        .post-content {
            padding: 12px;
        }

        .post-content p {
            margin: 5px 0;
            font-size: 14px;
            line-height: 1.4;
        }

        /* 🔱 BOTTOM NAVIGATION */
        .bottom {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid #1a1a1a;
            z-index: 1000;
        }

        .bottom a {
            text-decoration: none;
            font-size: 24px;
            filter: grayscale(1) invert(1); /* Icons white aakkan */
            transition: 0.2s;
        }

        .bottom a:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Pixora</h2>
    <a href="messages.html">💬</a>
</div>

<div class="feed" id="feed">
    <div class="post">
        <div class="post-header">
            <h4>@AiraAdam <span class="redtick"></span></h4>
        </div>
        <img src="https://picsum.photos/500/500">
        <div class="post-content">
            <p>Welcome to Pixora 🚀 Share your world muthe!</p>
        </div>
    </div>
</div>

<div class="bottom">
    <a href="home.html">🏠</a>
    <a href="reels.html">🎬</a>
    <a href="create.html">➕</a>
    <a href="messages.html">💬</a>
    <a href="profile.html">👤</a>
</div>

<script src="app.js"></script>

</body>
</html>
